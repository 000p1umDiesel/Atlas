device: mps                         # auto | cuda | mps | cpu
data_dir: .mnogobase
logs_dir: logs
runs_dir: runs

# Модели ролей (llm, embedder, rerank, vision). serve — где работает модель:
#   llamacpp / vllm — сервер поднимает `mnogobase models up` на порту роли (8000/8001/8002/8003);
#   api             — уже работающий сервер или API по base_url.
# model — HF-репозиторий исходной модели и её имя на сервере на любом бэкенде; gguf —
# квантизованные веса для llamacpp (repo:квант). Смена serve/gguf эмбеддера — `mnogobase reindex`.
llm:
  model: gpt-6-luna
  serve: api
  base_url: https://codex.sale/v1
  # локально: model: Qwen/Qwen3-30B-A3B-Instruct-2507, serve: llamacpp,
  #   gguf: unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M (base_url убрать)
  api_key_env: LLM_API_KEY
  concurrency: 16
  temperature: 0.1
  timeout_s: 360
  overrides: {extract: null, resolve: null, wiki: null, answer: null, query: null}

embedder:
  model: Qwen/Qwen3-Embedding-4B
  serve: llamacpp
  gguf: Qwen/Qwen3-Embedding-4B-GGUF:Q4_K_M
  dim: 2560
  doc_template: "{text}"
  query_template: "Instruct: Given a question, retrieve passages that answer it\nQuery: {query}"

sparse:
  model: Qdrant/bm25

parsing:
  ocr: true
  ocr_lang: ["iso:ru", "iso:en"]     # языки OCR; у RapidOCR работает первый (кириллическая модель читает и латиницу)
  extensions: [pdf, docx, pptx, xlsx, html, htm, md, adoc, csv, txt, png, jpg, jpeg, tif, tiff, bmp, webp]

chunking:
  # auto: токенизатор модели эмбеддера (HF-репозиторий embedder.model, у api — с её
  # сервера); иначе HF-репозиторий
  tokenizer: auto
  max_tokens: 512

extract:
  # имя типа: однострочное описание для промпта извлечения (Other остаётся последним)
  entity_types:
    Person: A real or fictional individual, named or clearly identified.
    Organization: A company, institution, university, government body, team or community; not the place it is located in (Location).
    Location: A country, city, region, geographic feature or a specific facility or building.
    Event: A dated happening such as a conference, incident, battle, release or election; not an ongoing initiative (Project).
    Project: A named initiative, programme or mission with a goal; not a one-off happening (Event).
    Product: A physical or commercial good or service that is not software, or a brand; software goes to Software.
    Software: A program, app, library, framework, programming language or software platform; a trained ML model goes to AIModel.
    Technology: A general technology, standard, protocol or hardware category, not a specific product or program (e.g. 5G, lithium-ion battery, blockchain).
    AIModel: A named trained machine-learning model or model family (e.g. GPT-4, BERT); the software running it goes to Software, the architecture or technique to Method.
    Method: A technique, algorithm, procedure or process for doing something (e.g. gradient descent, PCR); not an abstract idea (Concept) or a technology (Technology).
    Concept: An abstract idea, theory, principle or term; not a way of doing something (Method) or a whole discipline (Field).
    Field: A discipline or domain of knowledge or industry (e.g. machine learning, oncology, banking); not a single idea within it (Concept).
    Work: A book, paper, article, report, film, artwork, song or other created work, named by its title.
    Dataset: A named data collection, corpus or benchmark.
    Metric: A measure or indicator (e.g. accuracy, BLEU, GDP, inflation rate); not a benchmark (Dataset).
    Regulation: A law, regulation, policy, treaty or other legal act.
    Substance: A chemical, material, drug or food ingredient.
    Condition: A disease, disorder, symptom or other medical or psychological condition.
    Organism: A species, organism, cell type or other living thing.
    Other: Anything meaningful that fits none of the types above.
  max_failed_ratio: 0.2

resolve:
  auto_merge: 0.92
  llm_check: 0.80
  max_descriptions: 5

wiki:
  dir: wiki
  language: en
  min_mentions: 2
  evidence_k: 12

retrieval:
  k: 8
  context_tokens: 20000              # с neighbors: 2 попадание rag может занимать до ~2.5k токенов
  neighbors: 2                       # rag: чанки той же секции, добавляемые с каждой стороны от попадания
  translate: true                    # искать также по английскому переводу неанглийского вопроса
  answer_language: ru                # ru | en | ... | auto (язык вопроса)
  budget: {rag: 0.4, wiki: 0.3, graph: 0.3}

rerank:
  enabled: true                      # rag: переоценка гибридных попаданий cross-encoder'ом
  model: Qwen/Qwen3-Reranker-4B
  serve: llamacpp
  gguf: gorse-io/Qwen3-Reranker-4B-GGUF:Q4_K_M   # GGUF с классификатором Qwen3-Reranker
  candidates: 30                     # сколько гибридных попаданий оценивать на вопрос; остаются лучшие retrieval.k

vision:
  # описание картинок при разборе (графики, схемы, скриншоты) VLM-моделью: описание
  # становится текстом документа и дальше ищется, извлекается в граф и цитируется
  enabled: true
  model: Qwen/Qwen3-VL-2B-Instruct
  serve: llamacpp
  gguf: unsloth/Qwen3-VL-2B-Instruct-GGUF:Q4_K_M
  max_tokens: 400
  min_area: 0.05                     # картинки меньше этой доли страницы не описываются
  skip: [logo, icon, qr_code, bar_code, signature, stamp]   # классы картинок без описания

graph:
  hops: 2
  max_relations: 30
  seeds: 5
  seed_threshold: 0.3

qdrant:
  url: http://localhost:6333
  prefix: mb_

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password_env: NEO4J_PASSWORD
