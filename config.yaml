device: cuda                         # auto | cuda | mps | cpu
data_dir: .mnogobase
logs_dir: logs
runs_dir: runs

llm:
  base_url: https://codex.sale/v1    # local: http://localhost:11434/v1
  model: gpt-6-luna                  # local: gemma4:26b-a4b
  api_key_env: LLM_API_KEY
  concurrency: 16
  temperature: 0
  timeout_s: 120
  overrides: {extract: null, resolve: null, wiki: null, answer: null, query: null}

embedder:
  provider: ollama
  base_url: http://localhost:11434
  # model: embeddinggemma-2:740m
  # dim: 768
  # batch_size: 32
  # doc_template: "title: {title} | text: {text}"
  # query_template: "task: search result | query: {query}"
  # Qwen3-Embedding 4B instead of EmbeddingGemma 2 (switching models requires `mnogobase reindex`):
  model: qwen3-embedding:4b
  dim: 2560
  num_ctx: 2048                      # chunks are <= 512 tokens; the default ~40k context takes ~9 GB of VRAM
  doc_template: "{text}"
  query_template: "Instruct: Given a question, retrieve passages that answer it\nQuery: {query}"

sparse:
  model: Qdrant/bm25

parsing:
  ocr: true
  extensions: [pdf, docx, pptx, xlsx, html, htm, md, adoc, csv, txt]

chunking:
  # tokenizer: google/embeddinggemma-2
  tokenizer: Qwen/Qwen3-Embedding-4B
  max_tokens: 512

extract:
  # type name: one-line description for the extraction prompt (Other stays last)
  entity_types:
    Person: A real or fictional individual, named or clearly identified.
    Organization: A company, institution, university, government body, team or community; not the place it is located in (Location).
    Location: A country, city, region, geographic feature or a specific facility or building.
    Event: A dated happening such as a conference, incident, battle, release or election; not an ongoing initiative (Project).
    Project: A named initiative, programme or mission with a goal; not a one-off happening (Event).
    Product: A physical or commercial good or service that is not software, or a brand; software goes to Software.
    Software: A program, app, library, framework, programming language or software platform; a trained ML model goes to AIModel.
    Technology: A general technology, standard, protocol or hardware category, not a specific product or program (e.g. 5G, lithium-ion battery, blockchain).
    AIModel: A named trained machine-learning model or model family (e.g. GPT-4, BERT); the software running it goes to Software, the architecture or technique to Method.
    Method: A technique, algorithm, procedure or process for doing something (e.g. gradient descent, PCR); not an abstract idea (Concept) or a technology (Technology).
    Concept: An abstract idea, theory, principle or term; not a way of doing something (Method) or a whole discipline (Field).
    Field: A discipline or domain of knowledge or industry (e.g. machine learning, oncology, banking); not a single idea within it (Concept).
    Work: A book, paper, article, report, film, artwork, song or other created work, named by its title.
    Dataset: A named data collection, corpus or benchmark.
    Metric: A measure or indicator (e.g. accuracy, BLEU, GDP, inflation rate); not a benchmark (Dataset).
    Regulation: A law, regulation, policy, treaty or other legal act.
    Substance: A chemical, material, drug or food ingredient.
    Condition: A disease, disorder, symptom or other medical or psychological condition.
    Organism: A species, organism, cell type or other living thing.
    Other: Anything meaningful that fits none of the types above.
  max_failed_ratio: 0.2

resolve:
  auto_merge: 0.92
  llm_check: 0.80
  max_descriptions: 5

wiki:
  dir: wiki
  language: en
  min_mentions: 2
  evidence_k: 12

retrieval:
  k: 8
  context_tokens: 6000
  neighbors: 0                       # rag: same-section chunks added each side of a hit
  translate: true                    # also search with an English translation of a non-English question
  answer_language: ru                # ru | en | ... | auto (the language of the question)
  budget: {rag: 0.4, wiki: 0.3, graph: 0.3}

rerank:
  enabled: true                      # rag: rescore hybrid hits with a cross-encoder
  base_url: http://localhost:11434
  model: dengcao/Qwen3-Reranker-4B:Q4_K_M
  candidates: 30                     # hybrid hits scored per question; best retrieval.k kept
  concurrency: 4
  num_ctx: 4096                      # prompt + up to max_chars of chunk text

graph:
  hops: 2
  max_relations: 30
  seeds: 5
  seed_threshold: 0.3

qdrant:
  url: http://localhost:6333
  prefix: mb_

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password_env: NEO4J_PASSWORD
