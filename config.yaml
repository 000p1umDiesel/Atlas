device: cpu                         # auto | mps | cpu: устройство Docling/BM25; cpu — llama-server без GPU

# Модели ролей (llm, embedder, rerank, vision). serve — где работает модель:
#   llamacpp — llama-server на порту роли (8000/8001/8002/8003): локально его поднимает
#              `mnogobase models up`, в compose.yaml это сервисы embed / rerank / vision;
#   api      — уже работающий OpenAI-совместимый сервер или API по base_url.
#
# Что писать в model (под этим же именем модель видна на сервере):
#   llamacpp — GGUF-репозиторий с квантом, repo:квант (Qwen/Qwen3-Embedding-4B-GGUF:Q4_K_M).
#              Токенайзер берётся из самого GGUF, исходный HF-репозиторий не нужен.
#   api      — имя модели на сервере, как его отдаёт /v1/models.
# gguf — необязательно, только llamacpp: веса repo:квант отдельно от имени. Смена весов или
# serve эмбеддера — `mnogobase reindex`. Модели в compose.yaml должны совпадать с этими.

llm:
  model: gpt-6-luna
  serve: api
  base_url: https://codex.sale/v1
  # Сюда уходят тексты документов: выбирайте провайдера с понятными условиями обработки.
  # Локально: serve: llamacpp, model: unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M (base_url убрать)
  concurrency: 16
  temperature: 0.1
  timeout_s: 360

embedder:
  model: mradermacher/Qwen3-Embedding-0.6B-GGUF:Q8_0
  serve: llamacpp
  doc_template: "{text}"
  query_template: "Instruct: Given a question, retrieve passages that answer it\nQuery: {query}"

parsing:
  ocr: true
  ocr_lang: ["iso:ru", "iso:en"]     # языки OCR; у RapidOCR работает первый (кириллическая модель читает и латиницу)
  extensions: [pdf, docx, pptx, xlsx, html, htm, md, adoc, csv, txt, png, jpg, jpeg, tif, tiff, bmp, webp]

chunking:
  max_tokens: 512

extract:
  # имя типа: однострочное описание для промпта извлечения (Other остаётся последним)
  entity_types:
    Person: A real or fictional individual, named or clearly identified.
    Organization: A company, institution, university, government body, team or community; not the place it is located in (Location).
    Location: A place on Earth or in space, such as a country, city, region, geographic feature, facility, building or an astronomical object (planet, star, galaxy).
    Event: A dated happening such as a conference, incident, battle, release or election, or a named historical period; not an ongoing initiative (Project).
    Project: A named initiative, programme or mission with a goal; not a one-off happening (Event).
    Product: A commercial good or service, or a brand; software goes to Software, an instrument or machine used for work or research to Equipment.
    Equipment: A specific instrument, apparatus, machine, spacecraft or other device used for work or research (e.g. VLT/SPHERE, James Webb Space Telescope, Voyager 1); a general hardware category goes to Technology.
    Software: A program, app, library, framework, programming language, software platform or trained machine-learning model (e.g. PyTorch, GPT-4).
    Technology: A general technology, standard, protocol or hardware category, not a specific product or program (e.g. 5G, lithium-ion battery, blockchain).
    Method: A technique, algorithm or procedure that someone applies (e.g. gradient descent, PCR); a natural process or phenomenon goes to Concept, a technology to Technology.
    Concept: An abstract idea, theory, principle, term, natural process or phenomenon, or a whole discipline (e.g. inflation, photosynthesis, machine learning).
    Work: A book, paper, article, report, journal, film, artwork, song, dataset, benchmark or other created work, named by its title.
    Metric: A measure, indicator or unit (e.g. accuracy, BLEU, GDP, inflation rate, astronomical unit); a benchmark goes to Work.
    Regulation: A law, regulation, policy, treaty or other legal act.
    Substance: A chemical, material, drug, food ingredient or biomolecule such as a protein or hormone.
    Condition: A disease, disorder, symptom or other medical or psychological condition.
    Organism: A species, organism, cell type, organ or other living thing or part of one.
    Other: Anything meaningful that fits none of the types above.
  max_failed_ratio: 0.2

resolve:
  llm_check: 0.75
  max_descriptions: 5

wiki:
  language: en
  min_mentions: 2
  evidence_k: 12
  obsidian: true                     # .obsidian/graph.json: index/log скрыты из графа, цвета по типам

retrieval:
  k: 8
  context_tokens: 20000              # с neighbors: 2 попадание rag может занимать до ~2.5k токенов
  neighbors: 2                       # rag: чанки той же секции, добавляемые с каждой стороны от попадания
  translate: true                    # искать также по английскому переводу неанглийского вопроса
  answer_language: ru                # ru | en | ... | auto (язык вопроса)
  budget: {rag: 0.2, wiki: 0.2, graph: 0.6}

rerank:
  enabled: true                      # rag: переоценка гибридных попаданий cross-encoder'ом
  model: gorse-io/Qwen3-Reranker-0.6B-GGUF:Q8_0   # llamacpp: GGUF с классификатором Qwen3-Reranker
  serve: llamacpp
  candidates: 30                     # сколько гибридных попаданий оценивать на вопрос; остаются лучшие retrieval.k

vision:
  # описание картинок при разборе (графики, схемы, скриншоты) VLM-моделью: описание
  # становится текстом документа и дальше ищется, извлекается в граф и цитируется
  enabled: true
  model: prithivMLmods/Xiaomi-OCR-0-GGUF:Q6_K   # llamacpp: в репозитории есть проектор mmproj
  serve: llamacpp
  server:
    args: ["--image-min-tokens", "1024"]   # достаточно деталей для небольших картинок из PDF
  max_tokens: 400
  min_area: 0.05                     # картинки меньше этой доли страницы не описываются
  skip: [logo, icon, qr_code, bar_code, signature, stamp]   # классы картинок без описания

graph:
  traversal: apoc                   # bounded BFS; без APOC — обычный Cypher
  use_gds: true                      # читать готовый graph analyze; не запускать при ask
  community:
    enabled: true                   # Leiden: добирать исходные чанки сообществ seeds
    max_communities: 3
    max_entities: 30                 # на сообщество, отбор по PageRank
    max_chunks: 3                    # внутри retrieval.k, с резервом локальных источников
    timeout_s: 5
  hops: 2
  max_relations: 30
  seeds: 5
  seed_threshold: 0.3

qdrant:
  url: http://localhost:6333
  prefix: mb_
  api_key_env: QDRANT_API_KEY   # ключ в .env; Qdrant из compose.yaml без него не пускает

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password_env: NEO4J_PASSWORD

# eval score: null наследует подключение llm / embedder; ключи — только имена env.
evaluation:
  base_url: null
  model: null
  api_key_env: null
  embedding_url: null
  embedding_model: null
  embedding_api_key_env: null
  timeout_s: 360
  temperature: 0
  strictness: 3

database:                          # адрес PostgreSQL; пароль — POSTGRES_PASSWORD в .env
  host: localhost
  port: 5432
  name: mnogobase
  user: mnogobase
  schema_prefix: mnogobase
  project: default
