[project]
name = "mnogobase"
version = "0.1.0"
description = "LLM Wiki core: ingest documents into Qdrant + Neo4j, build a persistent wiki, answer with RAG / Wiki / Graph retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Точные версии всех прямых зависимостей; транзитивные закреплены в uv.lock.
  # Обновление: поменять версию здесь, затем `uv lock` и тесты.
  # ядро: разбор, хранилища, модели
  "docling==2.142.0",
  "docling-core==2.104.0",
  "pillow==13.0.0",
  "qdrant-client==1.19.1",
  "fastembed==0.9.1",
  "neo4j==6.4.1",
  # 3.3.0 — последняя openai, совместимая с instructor 1.17 (зависимость ragas): тот требует
  # jiter<0.15, а openai начиная с 3.3.1 — jiter>=0.16
  "openai==3.3.0",
  "httpx==0.28.1",
  "transformers==5.20.2",
  # на Linux (сервер, Docker) — CPU-колёса из индекса pytorch-cpu, см. [tool.uv.sources]
  "torch==2.15.0",
  "torchvision==0.29.2",
  # CLI, конфиг, логи
  "typer==0.26.8",
  "rich==14.3.4",
  "structlog==26.1.0",
  "pydantic==2.14.1",
  "pydantic-settings[yaml]==2.16.1",
  "python-dotenv==1.2.4",
  "pyyaml==6.0.3",
  "tenacity==9.2.1",
  "filelock==4.2.4",
  # состояние в PostgreSQL и HTTP API
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  # оценка Ragas (`mnogobase eval score`)
  "ragas==0.4.3",
  # сами не импортируем; пин нужен ragas 0.4.3, который падает на импорте с langchain-community 0.4
  "langchain-community==0.3.31",
  # тесты и линтер (обычные зависимости, без extras и групп: они есть и в образе)
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "testcontainers[neo4j,qdrant]==4.15.0",
  "reportlab==5.1.0",  # PDF для тестов разбора
  "python-docx==1.2.0",  # DOCX для тестов разбора
  "ruff==0.17.1",
]

[project.scripts]
mnogobase = "mnogobase.cli:app"

[tool.uv]
# поддерживаемые платформы: macOS (разработка) и Linux (сервер, Docker)
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# индекс CPU-сборок PyTorch (без CUDA, намного меньше); explicit — только для пакетов,
# которые явно на него ссылаются в [tool.uv.sources]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnogobase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: needs a running Docker daemon (testcontainers)",
  "e2e: needs Docker + model servers (mnogobase models up) + the LLM endpoint",
]
# по умолчанию только unit-тесты; integration и e2e запускаются явно через -m
addopts = "-m 'not integration and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # ruff >=0.16 форматирует и Markdown; примеры кода в планах и спецификациях docs/ — не код проекта

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # длинные строки берёт на себя `ruff format`
