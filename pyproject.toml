[project]
name = "mnogobase"
version = "0.1.0"
description = "LLM Wiki core: ingest documents into Qdrant + Neo4j, build a persistent wiki, answer with RAG / Wiki / Graph retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling>=2.142",
  "qdrant-client>=1.19.1",
  "fastembed>=0.9",
  "neo4j>=6.4",
  "openai>=3.3,<3.36",  # Instructor 1.17 requires jiter<0.15; OpenAI 3.36+ needs >=0.16
  "ragas==0.4.3",
  "langchain-community>=0.3,<0.4",
  "httpx>=0.28",
  "typer>=0.19",
  "rich>=14.0,<15",
  "structlog>=26.1",
  "pydantic>=2.14",
  "pydantic-settings[yaml]>=2.16",
  "python-dotenv>=1.1",
  "tenacity>=9.2",
  "filelock>=4.2",
  "pyyaml>=6.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "argon2-cffi>=23.1",
  "transformers>=5.20",
  # закреплено здесь, чтобы [tool.uv.sources] мог брать CUDA-колёса на Windows (PyPI там отдаёт только CPU-сборки)
  "torch>=2.14",
  "torchvision>=0.29",
  # GPU OCR (RapidOCR) и BM25 на Windows; сборка под CUDA 13, совпадает с torch cu130. Заменяет там CPU-onnxruntime.
  "onnxruntime-gpu[cuda,cudnn]>=1.30; sys_platform == 'win32'",
]

[project.scripts]
mnogobase = "mnogobase.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "testcontainers[neo4j,qdrant]>=4.15",
  "reportlab>=4.4",
  "python-docx>=1.1",
  "ruff>=0.16",
]

[tool.uv]
# onnxruntime и onnxruntime-gpu ставят один и тот же модуль `onnxruntime`: на Windows оставляем только GPU-версию
override-dependencies = ["onnxruntime>=1.30; sys_platform != 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnogobase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "integration: needs a running Docker daemon (testcontainers)",
  "e2e: needs Docker + model servers (mnogobase models up) + the LLM endpoint",
]
addopts = "-m 'not integration and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # ruff >=0.16 форматирует и Markdown; примеры кода в plan/spec — не код проекта

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # длинные строки берёт на себя `ruff format`
