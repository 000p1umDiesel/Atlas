# vLLM вместо Ollama (Linux + NVIDIA Container Toolkit): эмбеддер и реранкер, LLM — по профилю.
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml --profile llm up -d
# config.yaml (имена моделей = HF-репозитории; chunking.tokenizer: auto берёт токенайзер по ним):
#   embedder: {provider: openai, base_url: http://<host>:8001/v1, model: Qwen/Qwen3-Embedding-4B, dim: 2560}
#   rerank:   {provider: openai, base_url: http://<host>:8002/v1, model: Qwen/Qwen3-Reranker-4B}
#   llm:      {base_url: http://<host>:8000/v1, model: <VLLM_LLM_MODEL>}
# Каждый контейнер заранее резервирует долю ВСЕЙ памяти GPU (--gpu-memory-utilization, по
# умолчанию 0.92): на одной карте сумма долей должна быть < 1, поэтому сервисы стартуют по
# очереди. Доли и модели задаются переменными VLLM_* (в shell или .env).

x-vllm: &vllm
  image: vllm/vllm-openai:v0.31.0
  ipc: host
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
  volumes: ["hf_cache:/root/.cache/huggingface"]
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 30m  # первая загрузка модели с Hugging Face
  deploy:
    resources:
      reservations:
        devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  restart: unless-stopped

services:
  embed:
    <<: *vllm
    command:
      - ${VLLM_EMBED_MODEL:-Qwen/Qwen3-Embedding-4B}
      - --runner=pooling
      - --max-model-len=2048  # чанки <= chunking.max_tokens (512) + шаблон
      - --gpu-memory-utilization=${VLLM_EMBED_GPU:-0.15}
    ports: ["8001:8000"]

  rerank:
    <<: *vllm
    # hf-overrides превращают Qwen3-Reranker в классификатор yes/no, а шаблон из образа строит
    # его промпт: без --chat-template vLLM оценивает голую пару запрос/документ и врёт
    command:
      - ${VLLM_RERANK_MODEL:-Qwen/Qwen3-Reranker-4B}
      - --runner=pooling
      - '--hf-overrides={"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
      - --chat-template=/vllm-workspace/examples/pooling/score/template/qwen3_reranker.jinja
      - --max-model-len=4096  # запрос + rerank.max_chars текста документа
      - --gpu-memory-utilization=${VLLM_RERANK_GPU:-0.15}
    ports: ["8002:8000"]
    depends_on:
      embed: {condition: service_healthy}

  llm:
    <<: *vllm
    profiles: ["llm"]
    command:
      - ${VLLM_LLM_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507-FP8}
      - --max-model-len=${VLLM_LLM_CTX:-32768}
      - --gpu-memory-utilization=${VLLM_LLM_GPU:-0.6}
    ports: ["8000:8000"]
    depends_on:
      rerank: {condition: service_healthy}

volumes:
  hf_cache:
