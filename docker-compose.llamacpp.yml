# llama.cpp server (Linux + NVIDIA Container Toolkit): эмбеддер и реранкер,
# LLM — по профилю. GGUF скачиваются с Hugging Face (-hf) в volume llama_models.
#   docker compose -f docker-compose.yml -f docker-compose.llamacpp.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.llamacpp.yml --profile llm up -d
# Это значения config.yaml по умолчанию (имя модели = --alias, chunking.tokenizer: auto считает
# токены через /tokenize сервера) — с другой машины меняется только хост:
#   embedder: {base_url: http://<host>:8001/v1, model: qwen3-embedding-4b, dim: 2560}
#   rerank:   {enabled: true, base_url: http://<host>:8002/v1, model: qwen3-reranker-4b}
#   llm:      {base_url: http://<host>:8000/v1, model: qwen3-30b-a3b-instruct-2507}
# На Mac (нет GPU в Docker) те же модели и порты поднимает scripts/llama-local.sh.
# Модели задаются переменными LLAMACPP_* (в shell или .env), каждая вместе со своим
# LLAMACPP_*_ALIAS: alias — имя модели в config.yaml, оно входит в подпись индекса и ключ кэша.
# Порты слушают MODELS_BIND (по умолчанию 127.0.0.1: у серверов без --api-key нет авторизации).

x-llamacpp: &llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11515
  environment:
    LLAMA_CACHE: /models
    HF_TOKEN: ${HF_TOKEN:-}
  volumes: ["llama_models:/models"]
  deploy:
    resources:
      reservations:
        devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  restart: unless-stopped

services:
  embed:
    <<: *llamacpp
    command:
      - -hf
      - ${LLAMACPP_EMBED_MODEL:-Qwen/Qwen3-Embedding-4B-GGUF:Q4_K_M}
      - --alias=${LLAMACPP_EMBED_ALIAS:-qwen3-embedding-4b}
      - --embedding
      - --pooling=last
      - --ctx-size=8192
      - --ubatch-size=8192
      - --n-gpu-layers=999
      - --port=8080
    ports: ["${MODELS_BIND:-127.0.0.1}:8001:8080"]

  rerank:
    <<: *llamacpp
    # нужен GGUF с классификатором yes/no (cls.output) и шаблоном rerank, их пишет только
    # конвертер с поддержкой Qwen3-Reranker; GGUF dengcao/mradermacher/QuantFactory не подходят
    command:
      - -hf
      - ${LLAMACPP_RERANK_MODEL:-gorse-io/Qwen3-Reranker-4B-GGUF:Q4_K_M}
      - --alias=${LLAMACPP_RERANK_ALIAS:-qwen3-reranker-4b}
      - --rerank
      - --ctx-size=8192
      - --ubatch-size=8192
      - --n-gpu-layers=999
      - --port=8080
    ports: ["${MODELS_BIND:-127.0.0.1}:8002:8080"]

  llm:
    <<: *llamacpp
    profiles: ["llm"]
    command:
      - -hf
      - ${LLAMACPP_LLM_MODEL:-unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M}
      - --alias=${LLAMACPP_LLM_ALIAS:-qwen3-30b-a3b-instruct-2507}
      - --ctx-size=${LLAMACPP_LLM_CTX:-32768}
      - --n-gpu-layers=999
      - --port=8080
    ports: ["${MODELS_BIND:-127.0.0.1}:8000:8080"]

volumes:
  llama_models:
