# llama.cpp server вместо Ollama (Linux + NVIDIA Container Toolkit): эмбеддер и реранкер,
# LLM — по профилю. GGUF скачиваются с Hugging Face (-hf) в volume llama_models.
#   docker compose -f docker-compose.yml -f docker-compose.llamacpp.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.llamacpp.yml --profile llm up -d
# config.yaml (имя модели = --alias; llama.cpp не сообщает HF-репозиторий, поэтому токенайзер
# указывается явно):
#   embedder: {provider: openai, base_url: http://<host>:8001/v1, model: qwen3-embedding-4b, dim: 2560}
#   rerank:   {provider: openai, base_url: http://<host>:8002/v1, model: qwen3-reranker-4b}
#   llm:      {base_url: http://<host>:8000/v1, model: llm}
#   chunking: {tokenizer: Qwen/Qwen3-Embedding-4B}
# Модели задаются переменными LLAMACPP_* (в shell или .env).

x-llamacpp: &llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11515
  environment:
    LLAMA_CACHE: /models
    HF_TOKEN: ${HF_TOKEN:-}
  volumes: ["llama_models:/models"]
  deploy:
    resources:
      reservations:
        devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  restart: unless-stopped

services:
  embed:
    <<: *llamacpp
    command:
      - -hf
      - ${LLAMACPP_EMBED_MODEL:-Qwen/Qwen3-Embedding-4B-GGUF:Q4_K_M}
      - --alias=qwen3-embedding-4b
      - --embedding
      - --pooling=last
      - --ctx-size=8192
      - --ubatch-size=8192
      - --n-gpu-layers=999
      - --port=8080
    ports: ["8001:8080"]

  rerank:
    <<: *llamacpp
    # нужен GGUF с классификатором yes/no (cls.output) и шаблоном rerank, их пишет только
    # конвертер с поддержкой Qwen3-Reranker; GGUF dengcao/mradermacher/QuantFactory не подходят
    command:
      - -hf
      - ${LLAMACPP_RERANK_MODEL:-gorse-io/Qwen3-Reranker-4B-GGUF:Q4_K_M}
      - --alias=qwen3-reranker-4b
      - --rerank
      - --ctx-size=8192
      - --ubatch-size=8192
      - --n-gpu-layers=999
      - --port=8080
    ports: ["8002:8080"]

  llm:
    <<: *llamacpp
    profiles: ["llm"]
    command:
      - -hf
      - ${LLAMACPP_LLM_MODEL:-unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M}
      - --alias=llm
      - --ctx-size=${LLAMACPP_LLM_CTX:-32768}
      - --n-gpu-layers=999
      - --port=8080
    ports: ["8000:8080"]

volumes:
  llama_models:
