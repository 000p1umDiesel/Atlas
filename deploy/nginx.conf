# mnogobase за nginx на хосте (один файл). Установка: /etc/nginx/conf.d/mnogobase.conf
# Перед установкой замените SERVER_NAME на домен или IP сервера во всех местах:
#   sed -i 's/SERVER_NAME/kb.example.org/g' /etc/nginx/conf.d/mnogobase.conf
# Сертификат: certbot certonly --webroot -w /var/www/letsencrypt -d SERVER_NAME
# (для IP вместо домена — с --preferred-profile shortlived: Let's Encrypt выдаёт его на 6 дней,
# certbot продлевает сам). Подходит и nginx 1.18 из Ubuntu 22.04.

# В журнал не попадают тела запросов, токены и строки запроса.
log_format mnogobase_safe '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent $request_time';

# Логин: предел на IP и общий предел (IPv6 /64 легко даёт много адресов).
limit_req_zone $binary_remote_addr zone=mnogobase_login_ip:1m rate=5r/m;
limit_req_zone $server_name zone=mnogobase_login_all:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;
    server_tokens off;
    access_log /var/log/nginx/mnogobase.access.log mnogobase_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$server_name$request_uri;
    }
}

server {
    # default_server: при входе по IP браузер не передаёт имя (SNI), сертификат берётся отсюда
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name SERVER_NAME;
    server_tokens off;

    # Чужой Host не обслуживаем.
    if ($host != $server_name) {
        return 444;
    }

    ssl_certificate /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mnogobase_tls:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # JSON-запросы маленькие: большое тело до проверки сессии — это DoS по памяти.
    client_max_body_size 64k;
    client_body_timeout 60s;
    send_timeout 60s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # С доменом и рабочим сертификатом включите HSTS:
    # add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/mnogobase.access.log mnogobase_safe;
    error_log /var/log/nginx/mnogobase.error.log warn;

    # Настройки прокси наследуются всеми location ниже.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 3600s;   # ответ LLM с большим контекстом бывает долгим
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;

    # Режим Minecraft останавливает API: вместо 502 — понятный 503.
    error_page 502 =503 @mnogobase_unavailable;
    location @mnogobase_unavailable {
        default_type text/plain;
        charset utf-8;
        add_header Retry-After "60" always;
        return 503 "Сервис временно недоступен. Повторите запрос позже.\n";
    }

    location = /api/auth/login {
        limit_req zone=mnogobase_login_ip burst=5 nodelay;
        limit_req zone=mnogobase_login_all burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }

    # Загрузка документа: предел совпадает с service.max_upload_mb (50 МБ).
    location = /api/documents {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
