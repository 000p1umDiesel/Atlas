# fail2ban: неудачные входы в mnogobase по журналу nginx (формат mnogobase_safe из deploy/nginx.conf).
# Установка: /etc/fail2ban/filter.d/mnogobase-login.conf
# 401 — неверное имя или пароль, 429 — сработал limit_req на /api/auth/login.
# fail2ban вырезает дату из строки до сравнения, поэтому квадратные скобки пустые.
[Definition]
failregex = ^<HOST> \[\] "POST /api/auth/login" (?:401|429) 
ignoreregex =
