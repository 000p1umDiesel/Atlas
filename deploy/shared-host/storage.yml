# Merge with the repository docker-compose.yml through the storage wrapper.
# Pilot limits for a 16 GB host also running Minecraft; measure before increasing.
services:
  postgres:
    restart: "on-failure:5"
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
  qdrant:
    restart: "on-failure:5"
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
  neo4j:
    restart: "on-failure:5"
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    environment:
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 768M
      NEO4J_server_memory_pagecache_size: 256M

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/mnogobase/volumes/postgres
  qdrant_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/mnogobase/volumes/qdrant
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/mnogobase/volumes/neo4j
