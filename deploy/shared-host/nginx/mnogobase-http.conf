# Bootstrap site: only the ACME webroot is publicly readable; no plaintext API.
# Install as /etc/nginx/sites-available/mnogobase (then enable that site).
server {
    listen 80;
    listen [::]:80;
    server_name 152.234.234.206;
    server_tokens off;
    access_log /var/log/nginx/mnogobase.access.log mnogobase_safe;
    error_log /var/log/nginx/mnogobase.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
