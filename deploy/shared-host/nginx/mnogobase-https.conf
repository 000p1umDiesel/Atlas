# Replace the bootstrap site only after the trusted IP certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name 152.234.234.206;
    server_tokens off;
    access_log /var/log/nginx/mnogobase.access.log mnogobase_safe;
    error_log /var/log/nginx/mnogobase.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://152.234.234.206$request_uri;
    }
}

server {
    # IP clients normally omit TLS SNI, so this must own the default certificate.
    # Check for existing default TLS sites before installation; do not replace them.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 152.234.234.206;
    server_tokens off;

    # Reject unknown HTTP Host values even if this becomes the default TLS site.
    if ($host != 152.234.234.206) {
        return 444;
    }

    ssl_certificate /etc/letsencrypt/live/152.234.234.206/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/152.234.234.206/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mnogobase_tls:1m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Matches the service's default max_upload_mb=50; update both if changed.
    client_max_body_size 50m;
    client_body_timeout 60s;
    send_timeout 60s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/mnogobase.access.log mnogobase_safe;
    error_log /var/log/nginx/mnogobase.error.log warn;

    # Minecraft mode intentionally stops the API. nginx-generated connection errors
    # become a temporary-unavailability response; upstream API errors stay intact.
    # Keep proxy_intercept_errors off so auth/rate-limit/error bodies are preserved.
    error_page 502 =503 @mnogobase_unavailable;

    location @mnogobase_unavailable {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Retry-After "60" always;
        return 503 "Сервис временно недоступен. Повторите запрос позже.\n";
    }

    location = /api/auth/login {
        limit_req zone=mnogobase_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/mnogobase-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/mnogobase-proxy.conf;
    }
}
