# Install as /etc/nginx/conf.d/mnogobase.conf (inside nginx's http context).
# Keep credentials, question bodies and URL query strings out of access logs.
log_format mnogobase_safe '$remote_addr [$time_local] "$request_method $uri" '
                         '$status $body_bytes_sent $request_time';

# This is login abuse protection per source IP, not a team usage quota.
limit_req_zone $binary_remote_addr zone=mnogobase_login:1m rate=5r/m;
