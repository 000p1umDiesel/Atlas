[project]
name = "mnogobase-shared-host"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mnogobase", "torch==2.14.1", "torchvision==0.29.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = ["onnxruntime>=1.30; sys_platform != 'win32'"]

[tool.uv.sources]
mnogobase = { path = "../../..", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
