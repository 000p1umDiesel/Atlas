# Isolated cold-backup check. Never merge this with production Compose files.
services:
  postgres:
    image: ${RESTORE_POSTGRES_IMAGE:?Exact image ID from backup required}
    pull_policy: never
    environment:
      POSTGRES_DB: mnogobase
      POSTGRES_USER: mnogobase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Backup credentials required}
    volumes:
      - type: bind
        source: ${RESTORE_ROOT:?Private extracted backup required}/volumes/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnogobase -d mnogobase"]
      interval: 3s
      timeout: 5s
      retries: 40
  qdrant:
    image: ${RESTORE_QDRANT_IMAGE:?Exact image ID from backup required}
    pull_policy: never
    volumes:
      - type: bind
        source: ${RESTORE_ROOT:?}/volumes/qdrant
        target: /qdrant/storage
        bind:
          create_host_path: false
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
  neo4j:
    image: ${RESTORE_NEO4J_IMAGE:?Exact image ID from backup required}
    pull_policy: never
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Backup credentials required}
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 768M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - type: bind
        source: ${RESTORE_ROOT:?}/volumes/neo4j
        target: /data
        bind:
          create_host_path: false
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474/ || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
networks:
  default:
    internal: true
